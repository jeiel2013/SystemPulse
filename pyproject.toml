[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "systempulse-monitor"
version = "0.1.0.dev1"
description = "Open-source real-time system monitoring and diagnostics for your terminal."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
keywords = ["monitoring", "diagnostics", "terminal", "tui", "system"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "platformdirs>=4,<5",
    "psutil>=7.2,<8",
    "pydantic>=2,<3",
    "rich>=15,<16",
    "sqlalchemy>=2,<3",
    "textual>=8.2,<9",
    "typer>=0.24,<1",
]

[project.urls]
Homepage = "https://github.com/jeiel2013/SystemPulse"
Repository = "https://github.com/jeiel2013/SystemPulse"
Issues = "https://github.com/jeiel2013/SystemPulse/issues"
Changelog = "https://github.com/jeiel2013/SystemPulse/blob/main/CHANGELOG.md"

[project.scripts]
systempulse = "systempulse.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pre-commit>=4,<5",
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.11,<1",
    "types-psutil>=7.2.2,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/systempulse"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/systempulse",
    "tests",
    "scripts",
    "docs",
    "README.pt-BR.md",
    "CONTRIBUTING.md",
    "CONTRIBUTING.pt-BR.md",
    "CODE_OF_CONDUCT.md",
    "CODE_OF_CONDUCT.pt-BR.md",
    "SECURITY.md",
    "SECURITY.pt-BR.md",
    "CHANGELOG.md",
    "CHANGELOG.pt-BR.md",
    "ROADMAP.md",
    "ROADMAP.pt-BR.md",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["systempulse"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
